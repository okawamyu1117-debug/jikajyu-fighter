<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<link rel="manifest" href="./manifest.webmanifest"><title>JIKAJYU FIGHTER PROTOCOL</title>
<style>
*{box-sizing:border-box}:root{--bg:#080808;--p:#121212;--p2:#181818;--g:#d6ad4b;--gt:#f1d27a;--t:#f5f2ea;--m:#aaa59a;--l:#2b2925}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;padding-bottom:78px}
.app{max-width:720px;margin:auto;padding:12px}button{font:inherit;color:inherit;cursor:pointer}
.brand{font-weight:900;letter-spacing:.12em;color:var(--gt);font-size:14px}.sub,.muted{color:var(--m);font-size:11px}
.hero,.card,.stat,.day,.sheet{background:var(--p);border:1px solid var(--l);border-radius:16px}
.hero{padding:20px;margin:14px 0;background:linear-gradient(145deg,#191611,#0d0d0d)}
.kicker,.num{color:var(--g);font-size:11px;font-weight:900;letter-spacing:.12em}h1{font-size:28px;margin:6px 0}h2{font-size:18px;margin:5px 0}
.actions{display:flex;gap:8px;margin-top:16px}.primary,.secondary{border-radius:13px;padding:13px 15px;border:0;font-weight:900}.primary{background:var(--g);color:#080808;flex:1}.secondary{background:#191919;border:1px solid var(--l)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 18px}.stat{padding:12px}.stat b{display:block;color:var(--gt);font-size:20px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 16px}.day{padding:9px 2px;text-align:center;border:1px solid var(--l);background:var(--p)}.day.active{border-color:var(--g)}.day.done{box-shadow:inset 0 0 0 1px #d6ad4b55}.day small{display:block;color:var(--m);font-size:8px;margin-top:3px}
.panel{display:none}.panel.active{display:block}.head{display:flex;justify-content:space-between;align-items:end;margin:16px 0 9px}.tag{background:var(--g);color:#090909;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900}
.card{margin:8px 0;overflow:hidden}.ctop{display:flex;justify-content:space-between;gap:10px;padding:13px}.exercise{font-weight:850;font-size:15px;margin-top:3px}.rx{text-align:right;white-space:nowrap}.rx b{display:block;color:var(--gt);font-size:13px}.rx span{color:var(--m);font-size:9px}.desc{padding:0 13px 12px;color:#c6c0b5;font-size:12px;line-height:1.55}details{border-top:1px solid var(--l)}summary{padding:10px 13px;font-size:12px;color:#ddd;cursor:pointer}.check{border-top:1px solid var(--l);padding:10px 13px;font-size:12px;color:var(--m)}.check input{accent-color:var(--g);width:18px;height:18px;vertical-align:middle}
.note{background:#15130f;border-left:3px solid var(--g);padding:10px;border-radius:8px;color:#c8c1b3;font-size:11px;line-height:1.6}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0d0d0df2;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(3,1fr);padding:8px;z-index:5}.nav button{background:none;border:0;color:var(--m);font-size:11px}.nav button.active{color:var(--gt)}
.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:flex-end}.overlay.show{display:flex}.sheet{width:min(720px,100%);margin:auto;padding:18px;border-radius:22px 22px 0 0}.timer{font-size:64px;text-align:center;font-weight:900;color:var(--gt);margin:25px 0 4px;font-variant-numeric:tabular-nums}.timerlabel{text-align:center;color:var(--m);font-size:12px}.timerBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.timerBtns button{padding:14px;border-radius:13px;border:1px solid var(--l);background:#191919}.timerBtns .start{background:var(--g);color:#080808;border:0;font-weight:900}
.history{display:grid;gap:7px}.history div{padding:11px;border:1px solid var(--l);background:var(--p);border-radius:12px;font-size:12px}
@media(max-width:420px){h1{font-size:25px}.app{padding:10px}.week{gap:3px}.day{font-size:12px}}
</style></head><body><div class="app">
<div class="brand">JIKAJYU // FIGHTER PROTOCOL</div><div class="sub">BODYWEIGHT PERFORMANCE SYSTEM</div>

<section id="home" class="panel active"><div class="hero"><div class="kicker">TODAY'S SESSION</div><h1 id="today"></h1><div class="muted" id="meta"></div><div class="actions"><button class="primary" onclick="startToday()">今日のトレーニングを開始</button><button class="secondary" onclick="show('menu')">週間</button></div></div>
<div class="head"><h2>達成記録</h2><span class="muted">端末保存</span></div><div class="stats"><div class="stat"><b id="sessions">0</b><span class="muted">完了</span></div><div class="stat"><b id="streak">0</b><span class="muted">連続日</span></div><div class="stat"><b id="weekp">0%</b><span class="muted">今週</span></div></div>
<div class="head"><h2>WEEKLY</h2><span class="muted">曜日を選択</span></div><div id="week" class="week"></div><div class="head"><h2 id="todayTitle"></h2><span id="todayTag" class="tag"></span></div><div id="todayItems"></div></section>

<section id="menu" class="panel"><div class="head"><h2>週間メニュー</h2></div><div id="menuWeek" class="week"></div><div id="selected"></div></section>
<section id="progress" class="panel"><div class="head"><h2>達成記録</h2><button class="secondary" onclick="clearHist()">履歴消去</button></div><div class="stats"><div class="stat"><b id="ps">0</b><span class="muted">完了</span></div><div class="stat"><b id="pd">0</b><span class="muted">連続日</span></div><div class="stat"><b id="pw">0%</b><span class="muted">今週</span></div></div><div id="history" class="history"></div></section>
</div><nav class="nav"><button onclick="show('home')" class="active">⌂<br>ホーム</button><button onclick="show('menu')">▤<br>メニュー</button><button onclick="show('progress')">◈<br>記録</button></nav>

<div id="overlay" class="overlay"><div class="sheet"><div class="head"><div><div class="kicker">FIGHTER MODE</div><h2 id="timerName">REST</h2></div><button class="secondary" onclick="closeTimer()">閉じる</button></div><div id="timer" class="timer">00:00</div><div id="timerLabel" class="timerlabel">準備</div><div class="timerBtns"><button class="start" id="timerBtn" onclick="toggleTimer()">START</button><button onclick="skip()">SKIP</button></div></div></div>

<script>
const D={"mon": ["月曜", "下半身パワー", "POWER", [["スクワットジャンプ", "6〜8回 × 3", "90秒", "爆発的に跳び、静かに安定して着地。"], ["リバースランジ", "左右各10回 × 3", "60秒", "前脚の膝とつま先の向きをそろえる。"], ["ブロードジャンプ", "5回 × 3", "75秒", "距離より着地の安定を優先。"], ["ウォールシット", "30〜45秒 × 3", "45秒", "背中を壁につけ、腰を反らさない。"], ["ヒンズースクワット", "12回 × 3", "45秒", "無理のない可動域でリズムよく。"]]], "tue": ["火曜", "体幹・コンディショニング", "CORE", [["マウンテンクライマー", "30秒 × 4R", "15秒", "腰を反らさず一定のテンポ。"], ["プランク〜ダウンドッグ", "30秒 × 4R", "15秒", "体幹を保って滑らかに。"], ["レッグレイズ", "30秒 × 4R", "15秒", "反動を使わず、腰が浮かない範囲で。"], ["サイドプランク・ヒップディップ", "左右交互30秒 × 4R", "15秒", "体幹を一直線に保つ。"], ["スロー・バーピー", "30秒 × 4R", "15秒", "速さよりフォーム優先。"], ["デッドバグ", "左右各8回 × 3", "40秒", "腰を床から浮かせない。"]]], "wed": ["水曜", "回復・モビリティ＋シャドー", "RECOVER", [["90/90ヒップストレッチ", "30〜60秒 × 2", "—", "股関節をゆっくり動かす。"], ["ワールドグレイテストストレッチ", "30〜60秒 × 2", "—", "反動を使わず全身を動かす。"], ["キャットカウ", "30〜60秒 × 2", "—", "背骨をゆっくり動かす。"], ["胸椎回旋ストレッチ", "30〜60秒 × 2", "—", "骨盤を安定させる。"], ["シャドーボクシング", "2分 × 3R", "60秒", "強度7割。フットワークとリズム優先。"]]], "thu": ["木曜", "上半身プッシュ・爆発力", "PUSH", [["プライオメトリック・プッシュアップ", "5〜8回 × 4", "90秒", "一気に押し、柔らかく着地。"], ["ヒンズープッシュアップ", "10回 × 3", "60秒", "胸・肩・体幹を連動。"], ["パイクプッシュアップ", "8〜12回 × 3", "60秒", "首に体重を乗せず肩で押す。"], ["アーチャープッシュアップ", "左右各6回 × 3", "60秒", "片側へ無理なく体重移動。"], ["プランクショルダータップ", "左右各10回 × 3", "45秒", "腰を揺らさない。"], ["タイソン・プッシュアップ", "任意 BONUS", "—", "余裕がある場合のみ。無理に追加しない。"]]], "fri": ["金曜", "背中・体幹", "BACK", [["スーパーマンロウ", "12回 × 4", "60秒", "肩甲骨を寄せ、腰を反りすぎない。"], ["Yロウ・Tロウ・Wロウ", "各8回 × 3", "50秒", "Y→T→Wを反動なしで。"], ["リバーススノーエンジェル", "10回 × 3", "45秒", "肩をすくめず腕を動かす。"], ["ホローボディホールド", "20〜30秒 × 4", "45秒", "腰が反るなら脚を高くする。"]]], "sat": ["土曜", "フルボディ・コンディショニング", "FULL BODY", [["スクワットスラスト", "40秒 × 5R", "20秒", "全身を連動させる。"], ["シャドーボクシング", "40秒 × 5R", "20秒", "フットワーク＋パンチ。"], ["プランクジャック", "40秒 × 5R", "20秒", "腰の上下を抑える。"], ["ラテラルバウンド", "40秒 × 5R", "20秒", "左右へ安定して着地。"], ["プッシュアップ", "40秒 × 5R", "20秒", "疲れたら速度を落とす。"], ["ハイニー", "40秒 × 5R", "120秒", "最後まで維持できるペースで。"]]], "sun": ["日曜", "休養", "REST", [["完全休養", "—", "—", "身体を休める日。疲労や痛みがあるなら無理に運動しない。"]]]},O=["mon", "tue", "wed", "thu", "fri", "sat", "sun"];let selected=O[0],q=[],qi=0,left=0,tick=null;
function todayKey(){return ["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()]}
function done(){return JSON.parse(localStorage.getItem("jfp_done")||"{}")}
function hist(){return JSON.parse(localStorage.getItem("jfp_hist")||"[]")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function show(id){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach((x,i)=>x.classList.toggle("active",["home","menu","progress"][i]===id));render()}
function weekHTML(active){let z=done();return O.map(k=>`<button class="day ${k===active?"active":""} ${z[k]?"done":""}" onclick="selectDay('${k}')"><b>${D[k][0].replace("曜","")}</b><small>${D[k][2]}</small></button>`).join("")}
function cards(k,limit=99){return D[k][3].slice(0,limit).map((x,i)=>`<article class="card"><div class="ctop"><div><div class="num">${String(i+1).padStart(2,"0")}</div><div class="exercise">${esc(x[0])}</div></div><div class="rx"><b>${esc(x[1])}</b><span>休憩 ${esc(x[2])}</span></div></div><div class="desc">${esc(x[3])}</div><details><summary>フォーム解説</summary><div class="desc">フォームを優先。痛みが出る動作は中止し、無理に可動域を広げない。</div></details><label class="check"><input type="checkbox" onchange="exercise('${k}',${i},this.checked)"> この種目を完了</label></article>`).join("")}
function menu(k){let d=D[k];return `<div class="head"><div><div class="kicker">${d[0]}</div><h2>${esc(d[1])}</h2></div><span class="tag">${d[2]}</span></div><div class="note">ウォームアップ：関節を動かす＋軽い運動<br>クールダウン：呼吸を整えて軽くストレッチ<br>※フォーム優先。疲労や痛みが強い日は負荷を下げる。</div>${cards(k)}<button class="primary" style="width:100%;margin-top:8px" onclick="startDay('${k}')">FIGHTER MODEを開始</button>`}
function selectDay(k){selected=k;show("menu")}
function exercise(k,i,v){localStorage.setItem(`jfp_${k}_${i}`,v?"1":"0")}
function startToday(){startDay(todayKey())}
function startDay(k){selected=k;q=[];D[k][3].forEach(x=>{let n=parseInt(x[1]);if(x[1].includes("秒"))q.push([x[0],n,"WORK"]);let r=parseInt(x[2]);if(r)q.push(["REST",r,"REST"])});qi=0;openTimer()}
function openTimer(){document.getElementById("overlay").classList.add("show");loadTimer()}
function closeTimer(){clearInterval(tick);document.getElementById("overlay").classList.remove("show")}
function loadTimer(){if(qi>=q.length){finish();return}let x=q[qi];left=x[1];document.getElementById("timerName").textContent=x[0];document.getElementById("timerLabel").textContent=x[2];update();document.getElementById("timerBtn").textContent="START"}
function update(){document.getElementById("timer").textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`}
function toggleTimer(){if(tick){clearInterval(tick);tick=null;document.getElementById("timerBtn").textContent="START";return}document.getElementById("timerBtn").textContent="PAUSE";tick=setInterval(()=>{left--;update();if(left<=0){clearInterval(tick);tick=null;qi++;loadTimer()}},1000)}
function skip(){clearInterval(tick);tick=null;qi++;loadTimer()}
function finish(){let h=hist(),date=new Date().toISOString().slice(0,10);if(!h.some(x=>x.date===date&&x.day===selected)){h.unshift({date,day:selected,title:D[selected][1]});localStorage.setItem("jfp_hist",JSON.stringify(h.slice(0,100)))}let z=done();z[selected]=true;localStorage.setItem("jfp_done",JSON.stringify(z));document.getElementById("timerName").textContent="SESSION COMPLETE";document.getElementById("timerLabel").textContent="お疲れさま。回復もトレーニング。";left=0;update();render()}
function streak(){let s=new Set(hist().map(x=>x.date)),n=0,d=new Date();while(s.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function weekPct(){let now=new Date(),start=new Date(now);let day=now.getDay();start.setDate(now.getDate()-(day===0?6:day-1));start.setHours(0,0,0,0);return Math.min(100,Math.round(hist().filter(x=>new Date(x.date+"T00:00:00")>=start).length/6*100))}
function render(){let t=todayKey(),z=hist(),s=streak(),w=weekPct();document.getElementById("today").textContent=`${D[t][0]} — ${D[t][1]}`;document.getElementById("meta").textContent=`${D[t][2]} · スマホ用 FIGHTER MODE`;document.getElementById("todayTitle").textContent=D[t][1];document.getElementById("todayTag").textContent=D[t][2];document.getElementById("week").innerHTML=weekHTML(t);document.getElementById("menuWeek").innerHTML=weekHTML(selected);document.getElementById("todayItems").innerHTML=cards(t,4);document.getElementById("selected").innerHTML=menu(selected);document.getElementById("sessions").textContent=z.length;document.getElementById("streak").textContent=s;document.getElementById("weekp").textContent=w+"%";document.getElementById("ps").textContent=z.length;document.getElementById("pd").textContent=s;document.getElementById("pw").textContent=w+"%";document.getElementById("history").innerHTML=z.length?z.slice(0,30).map(x=>`<div>${x.date} · ${D[x.day][0]}<br><b>${esc(x.title)}</b> ✓</div>`).join(""):"<div>まだ記録はありません。</div>"}
function clearHist(){if(confirm("達成履歴を消去しますか？")){localStorage.removeItem("jfp_hist");localStorage.removeItem("jfp_done");render()}}
render();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script></body></html>
